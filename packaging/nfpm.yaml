name: vrghotspot
arch: ${PACKAGE_ARCH}
platform: linux
version: ${PACKAGE_VERSION}
release: 1
maintainer: app1oneme <app1oneme@users.noreply.github.com>
description: Share an embedded Mihomo VPN over Wi-Fi.
homepage: https://github.com/app1oneme/vrghotspot
license: GPL-3.0
archlinux:
  packager: app1oneme <app1oneme@users.noreply.github.com>
section: net
priority: optional
contents:
  - src: ${BINARY_DIR}/vrghotspot
    expand: true
    dst: /usr/bin/vrghotspot
    file_info:
      mode: 0755
  - src: ${BINARY_DIR}/vrghotspot-diagnostics
    expand: true
    dst: /usr/bin/vrghotspot-diagnostics
    file_info:
      mode: 0755
  - src: packaging/applonelabs.vrghotspot.policy
    dst: /usr/share/polkit-1/actions/applonelabs.vrghotspot.policy
    file_info:
      mode: 0644
  - src: packaging/vrghotspot.desktop
    dst: /usr/share/applications/vrghotspot.desktop
  - src: assets/icons/icon.png
    dst: /usr/share/icons/hicolor/32x32/apps/vrghotspot.png
    file_info:
      mode: 0644
  - src: LICENSE
    dst: /usr/share/licenses/vrghotspot/LICENSE
overrides:
  deb:
    depends: [libwebkit2gtk-4.1-0, libgtk-3-0t64, network-manager, iproute2, nftables, pkexec, hostapd, dnsmasq-base, iw]
  rpm:
    depends: [webkit2gtk4.1, gtk3, NetworkManager-wifi, iproute, nftables, polkit, hostapd, dnsmasq, iw]
  archlinux:
    depends: [webkit2gtk-4.1, gtk3, networkmanager, iproute2, nftables, polkit, hostapd, dnsmasq, iw]
