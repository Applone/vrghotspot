[package]
name = "vrghotspot"
version = "0.1.0"
edition = "2024"
build = "src/build.rs"
default-run = "vrghotspot"

[lib]
path = "src/lib.rs"

[[bin]]
name = "vrghotspot"
path = "src/main.rs"

[features]
default = ["custom-protocol"]
cli = []
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
anyhow = "=1.0.104"
async-trait = "=0.1.92"
base64 = "=0.23.1"
percent-encoding = "=2.3.2"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
serde_yaml = "=0.9.34"
sha2 = "=0.11.1"
hex = "=0.4.3"
libc = "=0.2.191"
sysinfo = "=0.40.4"
tauri = { version = "=2.12.7", features = [] }
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "=0.1.44"
tracing-appender = "=0.2.5"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt"] }
url = "=2.5.9"
uuid = { version = "=1.29.3", features = ["serde", "v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "=0.18.2"
zbus = { version = "=5.19.0", default-features = false, features = ["async-io", "blocking-api"] }

[target.'cfg(all(windows, target_arch = "x86_64"))'.dependencies]
windows = { version = "=0.62.2", features = [
    "Networking_Connectivity",
    "Networking_NetworkOperators",
    "Win32_Foundation",
    "Win32_NetworkManagement_Dns",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_Wmi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-future = "=0.3.2"

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }

[dev-dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "deny"

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
