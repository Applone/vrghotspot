name: Debug

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      bundle_subscription:
        description: Bundle the optional default VPN subscription
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: debug-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      configuration: Debug
      bundle_subscription: ${{ github.event_name == 'workflow_dispatch' && inputs.bundle_subscription }}
    secrets:
      VRG_DEFAULT_SUBSCRIPTION_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.bundle_subscription && secrets.VRG_DEFAULT_SUBSCRIPTION_URL || '' }}
