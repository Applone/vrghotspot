version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: [dependencies, rust]
    commit-message:
      prefix: chore(deps)
    groups:
      cargo-dependencies:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: [dependencies, frontend]
    commit-message:
      prefix: chore(deps)
    groups:
      frontend-dependencies:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: [dependencies, ci]
    commit-message:
      prefix: ci(deps)
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: gomod
    directory: /src/third_party/core_bridge
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: [dependencies, go]
    commit-message:
      prefix: chore(deps)
    groups:
      go-dependencies:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /packaging
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: [dependencies, containers]
    commit-message:
      prefix: chore(deps)
    groups:
      container-dependencies:
        patterns: ['*']
        update-types: [minor, patch]
