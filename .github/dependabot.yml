version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/src/third_party/core_bridge"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "go"
    assignees:
      - "Applone"
    commit-message:
      prefix: "chore(deps)"
    groups:
      gomod-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "rust"
    assignees:
      - "Applone"
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
    assignees:
      - "Applone"
    commit-message:
      prefix: "chore(deps)"
    groups:
      bun-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    assignees:
      - "Applone"
    commit-message:
      prefix: "ci(deps)"
    groups:
      ci-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/packaging"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "containers"
    assignees:
      - "Applone"
    commit-message:
      prefix: "chore(deps)"
    groups:
      docker-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
